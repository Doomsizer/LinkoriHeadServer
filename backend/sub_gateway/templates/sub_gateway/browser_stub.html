<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Linkori VPN — Подписка</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1020;
            color: #e6ebf5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 460px;
            width: 100%;
            background: #131a30;
            border: 1px solid #243054;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }
        p {
            margin: 0 0 16px;
            line-height: 1.55;
            color: #aab6d3;
            font-size: 15px;
        }
        .hint {
            background: #0f1528;
            border: 1px solid #243054;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: #cfd8ee;
        }
        a {
            color: #6ea8fe;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Linkori VPN</h1>
    <p>
        Эта ссылка предназначена только для подключения внутри VPN-приложения.
        В браузере конфигурация серверов не отображается.
    </p>
    <div class="hint">
        Скопируйте адрес из адресной строки и добавьте его в приложение
        (Happ, v2RayTun, Shadowrocket или Hiddify).
    </div>
    <p style="margin-top: 18px; margin-bottom: 0; font-size: 13px;">
        Личный кабинет: <a href="{{ web_url }}">{{ web_url }}</a>
    </p>
</div>
</body>
</html>
