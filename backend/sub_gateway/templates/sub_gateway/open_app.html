<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://linkori.org/icon.png">
    <link rel="apple-touch-icon" href="https://linkori.org/icon.png">
    <title>Открытие {{ app_label }} — Linkori</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #120b28;
            background-image:
                radial-gradient(640px 420px at 14% 0%, rgba(139, 92, 246, 0.24), transparent 72%),
                radial-gradient(560px 400px at 88% 12%, rgba(122, 233, 235, 0.16), transparent 72%),
                linear-gradient(180deg, #120b28 0%, #1b1238 60%, #120b28 100%);
            color: #efeaff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: #160e31;
            border: 1px solid rgba(122, 233, 235, 0.3);
            border-radius: 22px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(4, 1, 16, 0.92), 0 0 40px -16px rgba(122, 233, 235, 0.3);
        }
        h1 { margin: 0 0 10px; font-size: 22px; font-weight: 800; }
        p { margin: 0 0 22px; color: #9e96cc; font-size: 14px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            padding: 13px 18px;
            border-radius: 14px;
            background: #7ae9eb;
            color: #120b28;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 10px;
            box-shadow: 0 0 24px -6px rgba(122, 233, 235, 0.55);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 12px 18px;
            border-radius: 14px;
            background: #1b1238;
            color: #d8d0ff;
            border: 1px solid rgba(139, 92, 246, 0.35);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Открываем {{ app_label }}...</h1>
    <p>Если приложение не открылось автоматически, нажмите кнопку ниже.</p>
    <a class="btn" href="{{ deeplink }}">Открыть приложение</a>
    <button id="copy-btn" class="btn-secondary" type="button" onclick="copySubUrl()">
        Скопировать ссылку подписки
    </button>
</div>
<script>
    var deeplink = "{{ deeplink|escapejs }}";
    var subUrl = "{{ sub_url|escapejs }}";
    window.location.href = deeplink;
    function copySubUrl() {
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(subUrl).then(function () {
            var btn = document.getElementById("copy-btn");
            if (btn) btn.textContent = "Скопировано";
        });
    }
</script>
</body>
</html>
