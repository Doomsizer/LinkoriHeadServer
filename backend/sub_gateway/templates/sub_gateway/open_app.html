<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Открытие {{ app_label }} — Linkori VPN</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1020;
            color: #e6ebf5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: #131a30;
            border: 1px solid #243054;
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }
        p {
            margin: 0 0 20px;
            color: #aab6d3;
            font-size: 15px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px 18px;
            border-radius: 12px;
            background: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .btn-secondary {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px 18px;
            border-radius: 12px;
            background: #1b2544;
            color: #cfd8ee;
            border: 1px solid #2e3d6b;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Открываем {{ app_label }}...</h1>
    <p>Если приложение не открылось автоматически, нажмите кнопку ниже.</p>
    <a class="btn" href="{{ deeplink }}">Открыть приложение</a>
    <button class="btn-secondary" type="button" onclick="copySubUrl()">
        Скопировать ссылку подписки
    </button>
</div>
<script>
    var deeplink = "{{ deeplink|escapejs }}";
    var subUrl = "{{ sub_url|escapejs }}";
    window.location.href = deeplink;
    function copySubUrl() {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(subUrl);
        }
    }
</script>
</body>
</html>
