limit_req_zone $binary_remote_addr zone=sub_rate_limit:10m rate=10r/s;

upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Редирект HTTP -> HTTPS для обоих доменов
server {
    listen 80;
    listen [::]:80;
    server_name linkori.org www.linkori.org sub.linkori.org;
    return 301 https://$host$request_uri;
}

# ==========================================================
# 1. Основной домен: linkori.org (сайт Next.js + API + Admin)
# ==========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkori.org www.linkori.org;

    ssl_certificate /etc/letsencrypt/live/linkori.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkori.org/privkey.pem;

    client_max_body_size 10m;

    location /static/ {
        alias /opt/linkori/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фронтенд Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==========================================================
# 2. Домен подписок: sub.linkori.org (только выдача подписок)
# ==========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sub.linkori.org;

    ssl_certificate /etc/letsencrypt/live/sub.linkori.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.linkori.org/privkey.pem;

    # Отключаем доступ к админке, API и статике на домене подписок
    location ~ ^/(admin|api|static)/ {
        return 404;
    }

    # Корень домена подписок ничего не выдает
    location = / {
        return 404;
    }

    # Выдача подписки по /{sub_token}
    location / {
        limit_req zone=sub_rate_limit burst=20 nodelay;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }
}
