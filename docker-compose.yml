services:
  postgres:
    image: postgres:16-alpine
    container_name: linkori_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linkori_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django:
    build:
      context: ./backend
    container_name: linkori_django
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 30"
    volumes:
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    container_name: linkori_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: celery -A config worker -l info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
    container_name: linkori_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: celery -A config beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: linkori_frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://django:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - django

  bot:
    build:
      context: ./bot
    container_name: linkori_bot
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - ./bot.env
    environment:
      API_BASE_URL: http://django:8000
    depends_on:
      - django

volumes:
  postgres_data:
  redis_data: